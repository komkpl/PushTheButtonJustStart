<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just Start</title>
<meta name="description" content="Push the button. Just start.">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f2ee;
    --fg: #141414;
    --accent: #ff4a24;
    --accent-deep: #c22d0d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0d;
      --fg: #f4f2ee;
      --accent-deep: #9e240a;
    }
  }
  html, body { height: 100%; margin: 0; }
  body {
    box-sizing: border-box;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Roboto, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  #count {
    flex: 1;
    display: flex;
    align-items: center;
    font-size: min(30vw, 36vh);
    font-size: min(30vw, 36dvh);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.04em;
  }
  #time-button {
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    letter-spacing: inherit;
    line-height: inherit;
  }
  #time-button { cursor: pointer; }
  /* 数字をタップすると、分の部分が入力欄になる */
  #edit { display: none; align-items: baseline; }
  body.editing #time-button { display: none; }
  body.editing #edit { display: flex; }
  #minutes {
    /* 表示中の数字と同じ幅にして、編集に入っても位置がずれないようにする */
    width: calc(2ch - 0.08em);
    padding: 0;
    border: 0;
    border-bottom: 0.05em solid var(--accent);
    border-radius: 0;
    background: none;
    color: inherit;
    font: inherit;
    letter-spacing: inherit;
    line-height: inherit;
    text-align: right;
    caret-color: var(--accent);
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }

  #start {
    --width: min(72vw, 320px);
    --height: min(calc(var(--width) * 0.42), 18vh);
    --depth: calc(var(--height) * 0.12);
    width: var(--width);
    height: var(--height);
    margin-bottom: calc(max(8vh, 40px) + var(--depth));
    padding: 0;
    border: 0;
    border-radius: calc(var(--height) * 0.22);
    background: var(--accent);
    box-shadow: 0 var(--depth) 0 var(--accent-deep);
    cursor: pointer;
    transition: transform 60ms ease-out, box-shadow 60ms ease-out;
  }
  #start:active {
    transform: translateY(var(--depth));
    box-shadow: 0 0 0 var(--accent-deep);
  }
  #time-button:focus-visible, #start:focus-visible {
    outline: 3px solid var(--fg);
    outline-offset: 2px;
  }
  #start:focus-visible { outline-offset: calc(var(--depth) + 6px); }
</style>
</head>
<body>
<div id="count">
  <button id="time-button" type="button"><span id="time" role="timer"></span></button>
  <span id="edit">
    <input id="minutes" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2"
           enterkeyhint="done" autocomplete="off" aria-label="Minutes"><span aria-hidden="true">:00</span>
  </span>
</div>
<button id="start" type="button" aria-label="Start"></button>
<script>
  const DEFAULT_MINUTES = 25;
  const MAX_MINUTES = 99;
  const STORE_KEY = 'just-start';

  const time = document.getElementById('time');
  const timeButton = document.getElementById('time-button');
  const minutesInput = document.getElementById('minutes');
  const startButton = document.getElementById('start');

  // end は動いているタイマーの終了時刻（0なら未開始）。閉じても続きから表示できるよう保存する
  const state = { minutes: DEFAULT_MINUTES, end: 0 };
  try { Object.assign(state, JSON.parse(localStorage.getItem(STORE_KEY))); } catch {}
  if (!validMinutes(state.minutes)) state.minutes = DEFAULT_MINUTES;
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch {}
  }
  function validMinutes(m) {
    return Number.isInteger(m) && m >= 1 && m <= MAX_MINUTES;
  }

  function durationMs() {
    return state.minutes * 60 * 1000;
  }

  function format(s) {
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  // 0を見せたあと、この時間で開始時の表示（25:00 など）に戻して、次も押すだけで始められるようにする
  const HOLD_ZERO_MS = 1000;

  let timer = 0;
  function render() {
    clearTimeout(timer);
    if (state.end && Date.now() >= state.end + HOLD_ZERO_MS) {
      state.end = 0;
      save();
    }
    const ms = state.end ? Math.max(0, state.end - Date.now()) : durationMs();
    const s = Math.ceil(ms / 1000);
    time.textContent = format(s);
    if (!state.end) return;
    const next = ms > 0 ? ms - (s - 1) * 1000 : state.end + HOLD_ZERO_MS - Date.now();
    timer = setTimeout(render, next + 5);
  }

  function start() {
    state.end = Date.now() + durationMs();
    save();
    render();
  }

  // 分数の入力。Enter か欄の外をタップで確定、Esc で取り消し
  let cancelEdit = false;
  function editMinutes() {
    minutesInput.value = state.minutes;
    document.body.classList.add('editing');
    minutesInput.focus();
    minutesInput.select();
  }
  function finishEdit() {
    document.body.classList.remove('editing');
    const m = Number(minutesInput.value);
    if (!cancelEdit && validMinutes(m) && m !== state.minutes) {
      state.minutes = m;
      state.end = 0;
      save();
    }
    cancelEdit = false;
    render();
  }

  timeButton.addEventListener('click', editMinutes);
  minutesInput.addEventListener('input', () => {
    minutesInput.value = minutesInput.value.replace(/\D/g, '').slice(0, 2);
  });
  minutesInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') minutesInput.blur();
    if (e.key === 'Escape') {
      cancelEdit = true;
      minutesInput.blur();
    }
  });
  minutesInput.addEventListener('blur', finishEdit);

  startButton.addEventListener('click', start);

  // 開き直したときは、動いているタイマーの続きを表示する
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') render();
  });
  window.addEventListener('pageshow', (e) => { if (e.persisted) render(); });
  // iOS Safari で :active を効かせる
  document.addEventListener('touchstart', () => {}, { passive: true });

  render();
</script>
</body>
</html>
